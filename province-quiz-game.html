<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国省级地理答题小游戏</title>
<style>
:root{
  --bg:#f5f7fa; --card:#ffffff; --border:#e2e8f0;
  --text:#1e293b; --muted:#64748b; --primary:#2563eb;
  --primary-dark:#1d4ed8; --correct:#16a34a; --wrong:#dc2626;
  --marker:#ef4444; --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:20px 12px;
}
.wrap{width:100%;max-width:520px}
header{text-align:center;margin-bottom:16px}
header h1{font-size:22px;font-weight:700;letter-spacing:.5px}
header p{color:var(--muted);font-size:13px;margin-top:4px}

/* 选择器 */
.selector{display:flex;align-items:center;gap:10px;background:var(--card);
  border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.selector label{font-size:14px;font-weight:600;white-space:nowrap}
.selector select{flex:1;font-size:15px;padding:8px 10px;border:1px solid var(--border);
  border-radius:8px;background:#fff;color:var(--text);cursor:pointer;outline:none}
.selector select:focus{border-color:var(--primary)}

/* 计分板 */
.scorebar{display:flex;justify-content:space-between;align-items:center;
  margin:12px 0;font-size:14px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:10px 14px;box-shadow:var(--shadow)}
.scorebar .score{font-weight:700;color:var(--primary);font-size:18px}
.scorebar .stat{color:var(--muted)}
.scorebar .best{color:#d97706;font-weight:600}

/* 地图卡片 */
.map-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px;box-shadow:var(--shadow);text-align:center}
.map-card .prov-name{font-size:17px;font-weight:700;margin-bottom:8px}
.map-card .prov-name span{color:var(--primary)}
.map-svg{width:100%;height:auto;max-height:300px;border-radius:8px;background:#eef4fb;
  cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.map-svg:active{cursor:grabbing}
.map-tip{font-size:12px;color:var(--muted);margin-top:6px;text-align:center}

/* 题目 */
.question{margin-top:14px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:16px;box-shadow:var(--shadow)}
.question .q-text{font-size:15px;font-weight:600;text-align:center;margin-bottom:14px}
.question .q-text .dot{color:var(--marker);font-weight:800}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.option{padding:12px 8px;font-size:15px;border:2px solid var(--border);border-radius:10px;
  background:#fff;cursor:pointer;transition:all .15s;font-weight:500}
.option:hover{border-color:var(--primary);background:#eff6ff}
.option.correct{border-color:var(--correct);background:#f0fdf4;color:var(--correct)}
.option.wrong{border-color:var(--wrong);background:#fef2f2;color:var(--wrong)}
.option:disabled{cursor:not-allowed;opacity:.7}
.option:disabled.correct{opacity:1}

/* 反馈 */
.feedback{margin-top:12px;text-align:center;font-size:14px;font-weight:600;min-height:22px}
.feedback.right{color:var(--correct)}
.feedback.wrong{color:var(--wrong)}
.next-btn{display:none;margin:10px auto 0;padding:10px 28px;font-size:15px;font-weight:600;
  border:none;border-radius:10px;background:var(--primary);color:#fff;cursor:pointer}
.next-btn:hover{background:var(--primary-dark)}

/* 结果页 */
.result{display:none;background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:24px;box-shadow:var(--shadow);text-align:center;margin-top:14px}
.result h2{font-size:20px;margin-bottom:6px}
.result .final-score{font-size:40px;font-weight:800;color:var(--primary);margin:10px 0}
.result .detail{color:var(--muted);font-size:14px;margin-bottom:16px}
.result .restart{padding:10px 28px;font-size:15px;font-weight:600;border:none;border-radius:10px;
  background:var(--primary);color:#fff;cursor:pointer}
.result .restart:hover{background:var(--primary-dark)}
.result .new-best{color:#d97706;font-weight:700;font-size:15px;margin-bottom:8px}

footer{margin-top:16px;text-align:center;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🗺️ 中国省级地理答题</h1>
    <p>选择省份，看地图认城市</p>
  </header>

  <div class="selector">
    <label for="prov">省份</label>
    <select id="prov"></select>
  </div>

  <div class="scorebar">
    <div><span class="score" id="score">0</span> <span class="stat">分</span></div>
    <div class="stat">第 <span id="qnum">0</span>/10 题</div>
    <div class="best">最高 <span id="best">0</span> 分</div>
  </div>

  <div class="map-card">
    <div class="prov-name">当前省份：<span id="provName">—</span></div>
    <svg class="map-svg" id="map" viewBox="0 0 360 300" xmlns="http://www.w3.org/2000/svg">
      <g id="mapLayer"></g>
    </svg>
    <div class="map-tip">🖱️ 滚轮缩放 · 拖拽平移 · 双击复位</div>
  </div>

  <div class="question" id="questionArea">
    <div class="q-text">图中 <span class="dot">●</span> 标记的是哪个城市？</div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">下一题 →</button>
  </div>

  <div class="result" id="resultArea">
    <h2>本局结束</h2>
    <div class="new-best" id="newBest" style="display:none">🎉 新纪录！</div>
    <div class="final-score" id="finalScore">0</div>
    <div class="detail" id="finalDetail"></div>
    <button class="restart" id="restartBtn">再来一局</button>
  </div>

  <footer>单文件纯前端 · 数据来源于公开行政区划 · 适合课堂教学</footer>
</div>

/* ===== 游戏状态 ===== */
const TOTAL_QUESTIONS = 10;
let state = {
  provCode: null,      // 当前省份 code
  cities: [],          // 当前省份城市列表
  currentCity: null,   // 本题正确城市
  score: 0,
  qIndex: 0,           // 已答题数
  answered: false,
  best: 0,
};

/* ===== 工具函数 ===== */
function $(id){ return document.getElementById(id); }
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ===== localStorage 成绩 ===== */
const STORE_KEY = 'province_quiz_best';
function loadBest(){
  const v = localStorage.getItem(STORE_KEY);
  return v ? parseInt(v,10) : 0;
}
function saveBest(val){
  localStorage.setItem(STORE_KEY, String(val));
}

/* ===== 初始化省份下拉 ===== */
function initProvSelect(){
  const sel = $('prov');
  const codes = Object.keys(GAME_DATA).sort();
  codes.forEach(code=>{
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = GAME_DATA[code].name;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', ()=>{
    startGame(sel.value);
  });
}

/* ===== 渲染省份地图 ===== */
function renderMap(paths, marker){
  const layer = $('mapLayer');
  let inner = '';
  paths.forEach(d=>{
    inner += `<path d="${d}" fill="#cbd9f0" stroke="#5b7bb5" stroke-width="1.2" stroke-linejoin="round"/>`;
  });
  if(marker){
    inner += `
      <g>
        <circle cx="${marker.x}" cy="${marker.y}" r="9" fill="rgba(239,68,68,.25)"/>
        <circle cx="${marker.x}" cy="${marker.y}" r="5" fill="#ef4444" stroke="#fff" stroke-width="2"/>
        <text x="${marker.x}" y="${marker.y - 13}" text-anchor="middle"
          font-size="12" font-weight="700" fill="#dc2626">?</text>
      </g>
    `;
  }
  layer.innerHTML = inner;
  resetView();
}

/* ===== 生成题目 ===== */
function generateQuestion(){
  const prov = GAME_DATA[state.provCode];
  const cities = prov.cities;
  // 至少需要 4 个城市
  if(cities.length < 4){
    return null;
  }
  // 随机选正确城市
  const correct = cities[Math.floor(Math.random()*cities.length)];
  // 3 个干扰项（同省其他城市）
  const others = cities.filter(c=>c.name!==correct.name);
  const distractors = shuffle(others).slice(0,3);
  const options = shuffle([correct, ...distractors]);
  return { correct, options, paths: prov.paths };
}

/* ===== 渲染题目 ===== */
function renderQuestion(){
  const q = generateQuestion();
  if(!q){
    // 城市不足 4 个（澳门等），跳过
    $('feedback').textContent = '该省份城市数量不足，请选择其他省份';
    $('feedback').className = 'feedback wrong';
    return;
  }
  state.currentCity = q.correct;
  state.answered = false;
  $('feedback').textContent = '';
  $('feedback').className = 'feedback';
  $('nextBtn').style.display = 'none';
  // 渲染地图 + 标记点
  renderMap(q.paths, {x:q.correct.x, y:q.correct.y});
  // 渲染选项
  const optBox = $('options');
  optBox.innerHTML = '';
  q.options.forEach(o=>{
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = o.name;
    btn.addEventListener('click', ()=>onAnswer(btn, o.name, q.correct.name));
    optBox.appendChild(btn);
  });
  $('qnum').textContent = state.qIndex + 1;
}

/* ===== 作答 ===== */
function onAnswer(btn, chosen, correct){
  if(state.answered) return;
  state.answered = true;
  const isRight = (chosen === correct);
  const buttons = $('options').querySelectorAll('.option');
  buttons.forEach(b=>{
    b.disabled = true;
    if(b.textContent === correct){
      b.classList.add('correct');
    } else if(b.textContent === chosen && !isRight){
      b.classList.add('wrong');
    }
  });
  // 计分
  if(isRight){
    state.score += 10;
    $('score').textContent = state.score;
    $('feedback').textContent = '✅ 答对了！' + correct;
    $('feedback').className = 'feedback right';
    // 标记点变绿提示
    highlightMarker(true);
  } else {
    $('feedback').textContent = '❌ 答错了，正确答案是：' + correct;
    $('feedback').className = 'feedback wrong';
    highlightMarker(false);
  }
  // 显示下一题
  if(state.qIndex + 1 >= TOTAL_QUESTIONS){
    $('nextBtn').textContent = '查看成绩';
  }
  $('nextBtn').style.display = 'block';
}

/* ===== 高亮正确标记（答题后重绘，显示结果） ===== */
function highlightMarker(right){
  const prov = GAME_DATA[state.provCode];
  const m = state.currentCity;
  const color = right ? '#16a34a' : '#dc2626';
  // 重新绘制轮廓 + 结果标记（不带"?"）
  const layer = $('mapLayer');
  let inner = '';
  prov.paths.forEach(d=>{
    inner += `<path d="${d}" fill="#cbd9f0" stroke="#5b7bb5" stroke-width="1.2" stroke-linejoin="round"/>`;
  });
  inner += `
    <g>
      <circle cx="${m.x}" cy="${m.y}" r="10" fill="${color}" opacity="0.22"/>
      <circle cx="${m.x}" cy="${m.y}" r="6" fill="${color}" stroke="#fff" stroke-width="2"/>
      <text x="${m.x}" y="${m.y - 15}" text-anchor="middle"
        font-size="12" font-weight="700" fill="${color}">${m.name}</text>
    </g>
  `;
  layer.innerHTML = inner;
  resetView();
}

/* ===== 地图缩放与平移 ===== */
const VIEW = { scale:1, tx:0, ty:0, MIN:1, MAX:6 };
function applyView(){
  const layer = $('mapLayer');
  layer.setAttribute('transform', `translate(${VIEW.tx} ${VIEW.ty}) scale(${VIEW.scale})`);
}
function resetView(){
  VIEW.scale = 1; VIEW.tx = 0; VIEW.ty = 0;
  applyView();
}
// 将屏幕坐标（相对 SVG）转成 viewBox 坐标
function screenToView(svg, clientX, clientY){
  const pt = svg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  const ctm = svg.getScreenCTM();
  if(!ctm) return {x:clientX, y:clientY};
  const p = pt.matrixTransform(ctm.inverse());
  return {x:p.x, y:p.y};
}
function setupMapInteraction(){
  const svg = $('map');
  // 滚轮缩放（以鼠标为锚点）
  svg.addEventListener('wheel', (e)=>{
    e.preventDefault();
    const anchor = screenToView(svg, e.clientX, e.clientY);
    const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
    const newScale = Math.max(VIEW.MIN, Math.min(VIEW.MAX, VIEW.scale * factor));
    if(newScale === VIEW.scale) return;
    const k = newScale / VIEW.scale;
    // 保持锚点在缩放后仍位于同一屏幕位置
    VIEW.tx = anchor.x - k * (anchor.x - VIEW.tx);
    VIEW.ty = anchor.y - k * (anchor.y - VIEW.ty);
    VIEW.scale = newScale;
    applyView();
  }, {passive:false});
  // 拖拽平移
  let dragging = false, lastX = 0, lastY = 0;
  svg.addEventListener('pointerdown', (e)=>{
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
    svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    VIEW.tx += (e.clientX - lastX) * (360 / svg.getBoundingClientRect().width);
    VIEW.ty += (e.clientY - lastY) * (300 / svg.getBoundingClientRect().height);
    lastX = e.clientX; lastY = e.clientY;
    applyView();
  });
  svg.addEventListener('pointerup', (e)=>{
    dragging = false;
    try{ svg.releasePointerCapture(e.pointerId); }catch(_){}
  });
  svg.addEventListener('pointercancel', ()=>{ dragging = false; });
  // 双击复位
  svg.addEventListener('dblclick', ()=>{ resetView(); });
}

/* ===== 下一题 / 结束 ===== */
$('nextBtn').addEventListener('click', ()=>{
  state.qIndex++;
  if(state.qIndex >= TOTAL_QUESTIONS){
    endGame();
  } else {
    renderQuestion();
  }
});

/* ===== 结束游戏 ===== */
function endGame(){
  $('questionArea').style.display = 'none';
  const isBest = state.score > state.best;
  if(isBest){
    state.best = state.score;
    saveBest(state.best);
    $('best').textContent = state.best;
    $('newBest').style.display = 'block';
  } else {
    $('newBest').style.display = 'none';
  }
  $('finalScore').textContent = state.score;
  $('finalDetail').textContent = `共 ${TOTAL_QUESTIONS} 题，答对 ${state.score/10} 题，得分 ${state.score} 分`;
  $('resultArea').style.display = 'block';
}

/* ===== 开始游戏 ===== */
function startGame(provCode){
  state.provCode = provCode;
  state.score = 0;
  state.qIndex = 0;
  state.answered = false;
  $('score').textContent = 0;
  $('provName').textContent = GAME_DATA[provCode].name;
  $('resultArea').style.display = 'none';
  $('questionArea').style.display = 'block';
  renderQuestion();
}

/* ===== 重新开始 ===== */
$('restartBtn').addEventListener('click', ()=>{
  startGame(state.provCode);
});

/* ===== 启动 ===== */
(function init(){
  state.best = loadBest();
  $('best').textContent = state.best;
  initProvSelect();
  setupMapInteraction();
  // 默认选第一个省份
  const first = $('prov').options[0].value;
  startGame(first);
})();
</script>
